services:
  vault-provisioner:
    build: 
      context: .
      dockerfile: ./vault/Dockerfile
    volumes:
      - secrets-flow:/shared
    secrets:
      - vault_password

  oracle-db:
    image: gvenzl/oracle-free:slim
    container_name: oracle_db
    environment:
      - APP_USER=${DB_USER}
      - ORACLE_PASSWORD_FILE=/run/secrets/db_pass.txt
      - APP_USER_PASSWORD_FILE=/run/secrets/db_pass.txt
    ports:
      - "1521:1521"
    volumes:
      - secrets-flow:/run/secrets
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      vault-provisioner:
        condition: service_completed_successfully

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--list", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  amazon-rating-prediction:
    build: .
    image: ${API_IMAGE:-rating-prediction-local}
    container_name: rating-prediction
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=predictions
    volumes:
      - secrets-flow:/run/secrets
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      kafka:
        condition: service_healthy

  rating-consumer:
    build: .
    image: ${API_IMAGE:-rating-prediction-local}
    container_name: rating-consumer
    restart: unless-stopped
    command: ["python", "-m", "consumer.main"]
    environment:
      - DB_USER=${DB_USER}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_SERVICE=${DB_SERVICE}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=predictions
    volumes:
      - secrets-flow:/run/secrets
    depends_on:
      oracle-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  integration-tests:
    build: 
      context: .
      dockerfile_inline: |
        FROM python:3.9-slim
        WORKDIR /app
        COPY ./tests /app/tests
        RUN pip install requests
        CMD ["python", "tests/run_scenario.py"]
    profiles: ["test"]
    environment:
      - API_URL=http://amazon-rating-prediction:8000
    depends_on:
      amazon-rating-prediction:
        condition: service_healthy

volumes:
  secrets-flow:

secrets:
  vault_password:
    environment: "VAULT_PASS"